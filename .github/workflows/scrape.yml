name: Check FLOW member list

# Runs on a self-hosted runner (the owner's Mac), because transportation.gov
# blocks requests from GitHub's and the reader service's cloud servers.
# If the Mac is asleep when the schedule fires, the job waits (up to 24 hours)
# and runs as soon as the Mac is back online.

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 13:17 UTC = 10:17 PM Korea
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flow-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r requirements.txt

      - name: Fetch and compare member list
        run: .venv/bin/python scraper/scrape.py

      - name: Commit if the member list changed
        run: |
          if [ -z "$(git status --porcelain data/members.csv data/changelog.csv data/snapshots)" ]; then
            echo "Member list unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "flow-observatory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "FLOW members updated: $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet origin main
          git push
