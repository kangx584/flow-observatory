name: Check FLOW member list

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 13:17 UTC = 10:17 PM Korea
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flow-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and compare member list
        run: python scraper/scrape.py

      - name: Commit if the member list changed
        run: |
          if [ -z "$(git status --porcelain data/members.csv data/changelog.csv data/snapshots)" ]; then
            echo "Member list unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "flow-observatory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "FLOW members updated: $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet origin main
          git push
